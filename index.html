  /* 건물/던전 상호작용 정보 모달 (하단 중앙) */
  #info-modal {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);

  @keyframes popUp {

  #info-modal .modal-header {

  #info-modal .modal-close {

<script type="module">
import * as THREE from "three";

// ============================================================
// Packet Knight — Stage 3.1: 캐릭터 컨트롤 고도화
// PRD.md §7 Stage 3 DoD (scripts/smoke.mjs 로 자동 검증):
// "큐브가 지형 단차를 오르내리고 건물에 부딪힌다"
// ============================================================

// ---------- 1. 씬 & 렌더러 ----------
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ec9e8);
scene.fog = new THREE.Fog(0x8ec9e8, 90, 220);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 400);

// 조명 (따뜻한 햇살 + 환경광)
const sun = new THREE.DirectionalLight(0xfff5dd, 1.65);
sun.position.set(50, 75, 40);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xc6e0ff, 0.65));
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x3f6b3a, 0.55));

// ---------- 2. 지형 규격 & 칸 단위 높이맵 (시각·물리 단일 진실 공급원) ----------
const ISLAND_RADIUS = 26;
const VILLAGE_RADIUS = 16.5; // 마을 평지 반경
const SURFACE_Y = 2.0;       // 마을 평지 표면 높이
const DUNGEON_PIT_Y = -0.5;  // 지하 던전 바닥 표면 높이
const SEA_LEVEL = 0;
const PLAY_RADIUS = 24.5;    // 섬 외곽 이동 한계
const HEIGHT_STEP = 0.5;     // 높이 양자화 단위 (반 블록 계단)

// 던전 입구 위치 및 계단 구역 (북서쪽 외곽)
const DUNGEON_X = -9.0;
const DUNGEON_Z = -13.0;

function isDungeonCell(x, z) {
  return Math.abs(x - DUNGEON_X) <= 2.2 && z >= -14.5 && z <= -8.0;
}

/** 연속 높이 설계 함수 (생성 전용 — 물리는 cellHeight를 쓴다) */
function rawHeight(x, z) {
  if (isDungeonCell(x, z)) {
    const t = THREE.MathUtils.clamp((-8.0 - z) / 5.5, 0, 1);
    return SURFACE_Y - t * (SURFACE_Y - DUNGEON_PIT_Y);
  }
  const r = Math.hypot(x, z);
  if (r <= VILLAGE_RADIUS) return SURFACE_Y;
  return SURFACE_Y - Math.min(2.5, (r - VILLAGE_RADIUS) * 0.35);
}

/**
 * 칸 (i, j)는 월드 [i, i+1] × [j, j+1] 영역을 덮는다.
 * 높이는 칸 중심에서 샘플링해 HEIGHT_STEP 단위로 양자화한다.
 * → 렌더링된 블록 윗면과 캐릭터가 밟는 높이가 항상 정확히 일치한다.
 */
const heightMap = new Map();
const cellKey = (i, j) => i * 1000 + j;
for (let i = -ISLAND_RADIUS; i < ISLAND_RADIUS; i++) {
  for (let j = -ISLAND_RADIUS; j < ISLAND_RADIUS; j++) {
    const cx = i + 0.5, cz = j + 0.5;
    if (Math.hypot(cx, cz) > ISLAND_RADIUS) continue;
    heightMap.set(cellKey(i, j), Math.round(rawHeight(cx, cz) / HEIGHT_STEP) * HEIGHT_STEP);
  }
}

function cellHeight(i, j) {
  const h = heightMap.get(cellKey(i, j));
  return h === undefined ? -Infinity : h;
}

/** 임의의 (x, z) 위치에서 실제 밟는 지표면(Top Face) 높이 Y */
function groundHeightAt(x, z) {
  return cellHeight(Math.floor(x), Math.floor(z));
}

// 재질 정의
const grassMat  = new THREE.MeshLambertMaterial({ color: 0x5ea840 });
const pathMat   = new THREE.MeshLambertMaterial({ color: 0x8f98a2 });
const plazaMat  = new THREE.MeshLambertMaterial({ color: 0xa8b1bc });
const sandMat   = new THREE.MeshLambertMaterial({ color: 0xd9c78a });
const dirtMat   = new THREE.MeshLambertMaterial({ color: 0x8a6a45 });
const stoneMat  = new THREE.MeshLambertMaterial({ color: 0x6e737b });
const darkStone = new THREE.MeshLambertMaterial({ color: 0x2b2f36 });
const waterMat  = new THREE.MeshLambertMaterial({ color: 0x226cb5, transparent: true, opacity: 0.88 });

// 복셀 레이어 빌더 — p = [칸 x, 블록 윗면 y, 칸 z]
function buildVoxelLayer(list, material) {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mesh = new THREE.InstancedMesh(geo, material, list.length);
  const m = new THREE.Matrix4();
  list.forEach((p, i) => {
    m.makeTranslation(p[0] + 0.5, p[1] - 0.5, p[2] + 0.5);
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  return mesh;
}

const layer = { grass: [], path: [], plaza: [], sand: [], dirt: [], stone: [], darkStone: [] };
const BEDROCK_Y = -4;

for (const key of heightMap.keys()) {
  const i = Math.round(key / 1000);
  const j = key - i * 1000;
  const x = i + 0.5, z = j + 0.5; // 칸 중심
  const top = heightMap.get(key);
  const r = Math.hypot(x, z);

  if (isDungeonCell(x, z)) {
    layer.darkStone.push([i, top, j]);
    for (let y = top - 1; y > BEDROCK_Y; y--) layer.stone.push([i, y, j]);
    continue;
  }

  const isCentralPlaza = r <= 3.2;
  const isNorthAve = Math.abs(x) <= 1 && z >= -9 && z <= 0;
  const isSouthAve = Math.abs(x) <= 1 && z >= 0 && z <= 8;
  const isEastWestAve = (z >= -2 && z <= 0) && (x >= -10 && x <= 10);
  const isDungeonRoad = (z <= -4 && z >= -8) && Math.abs(x - (DUNGEON_X * ((-4 - z) / 4.0))) <= 1.2;
  const isBeaconRoad = (z >= 4 && z <= 9) && Math.abs(x - (8.0 * ((z - 4) / 4.0))) <= 1.2;
  const isRoad = isNorthAve || isSouthAve || isEastWestAve || isDungeonRoad || isBeaconRoad;

  let topType = "grass";
  if (r > VILLAGE_RADIUS + 2.5) topType = "sand";
  else if (isCentralPlaza) topType = "plaza";
  else if (isRoad) topType = "path";

  layer[topType].push([i, top, j]);

  // 하부 층: 이웃 칸보다 낮아지는 절벽 면이 비지 않도록 충분히 깊게 쌓는다
  const depth = topType === "sand" ? 2 : 4;
  for (let d = 1; d <= depth; d++) {
    const y = top - d;
    if (y <= BEDROCK_Y) break;
    if (d === depth) layer.stone.push([i, y, j]);
    else layer[topType === "sand" ? "sand" : "dirt"].push([i, y, j]);
  }
}

const terrain = new THREE.Group();
terrain.add(buildVoxelLayer(layer.grass,     grassMat));
terrain.add(buildVoxelLayer(layer.path,      pathMat));
terrain.add(buildVoxelLayer(layer.plaza,     plazaMat));
terrain.add(buildVoxelLayer(layer.sand,      sandMat));
terrain.add(buildVoxelLayer(layer.dirt,      dirtMat));
terrain.add(buildVoxelLayer(layer.stone,     stoneMat));
terrain.add(buildVoxelLayer(layer.darkStone, darkStone));
scene.add(terrain);

// 바다
const sea = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), waterMat);
sea.rotation.x = -Math.PI / 2;
sea.position.y = SEA_LEVEL - 0.2;
scene.add(sea);

// ---------- 3. 인터랙티브 건물 & 마을 오브젝트 관리 ----------
const interactiveObjects = [];

function registerInteractive(meshOrGroup, data) {
  meshOrGroup.userData.interactive = data;
  interactiveObjects.push(meshOrGroup);
}

// 공용 복셀 건물 재질
const woodMat   = new THREE.MeshLambertMaterial({ color: 0x7a4f2b });
const plasterMat= new THREE.MeshLambertMaterial({ color: 0xecf0f2 });
const redRoof   = new THREE.MeshLambertMaterial({ color: 0xb53c30 });
const blueRoof  = new THREE.MeshLambertMaterial({ color: 0x24558f });
const copperRoof= new THREE.MeshLambertMaterial({ color: 0xbf5d28 });
const glassMat  = new THREE.MeshBasicMaterial({ color: 0xffea88 });
const cyanEmblem= new THREE.MeshBasicMaterial({ color: 0x39d0ff });
const metalMat  = new THREE.MeshLambertMaterial({ color: 0xb5c1cd });

// ----- 3.1 🏛️ GATT 중앙 회관 (Central Service Hall) -----
const hall = new THREE.Group();
{
  const b1 = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2.2, 3.0), plasterMat);
  b1.position.y = 1.1;
  hall.add(b1);

  [[-1.8, -1.4], [1.8, -1.4], [-1.8, 1.4], [1.8, 1.4]].forEach(([px, pz]) => {
    const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.35, 2.3, 0.35), woodMat);
    pillar.position.set(px, 1.15, pz);
    hall.add(pillar);
  });

  const door = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.5, 0.08), woodMat);
  door.position.set(0, 0.75, 1.52);
  hall.add(door);

  [-1.1, 1.1].forEach(wx => {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, 0.04), glassMat);
    win.position.set(wx, 1.25, 1.52);
    hall.add(win);
  });

  const r1 = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.45, 3.4), redRoof);
  r1.position.y = 2.35;
  hall.add(r1);

  const r2 = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.45, 2.4), redRoof);
  r2.position.y = 2.75;
  hall.add(r2);

  const rune = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), cyanEmblem);
  rune.position.set(0, 3.25, 0);
  hall.add(rune);
}
hall.position.set(0, SURFACE_Y, -8.5);
scene.add(hall);

registerInteractive(hall, {
  title: "🏛️ GATT 중앙 회관",
  sub: "[데이터 프로필 허브]",
  desc: "스펙트럼 대륙의 모든 서비스(Service)와 특성(Characteristic)이 등록되는 행정 중앙 회관입니다. 시민 NPC들에게 데이터를 읽기(Read), 쓰기(Write), 알림(Notify) 받는 퀘스트를 수주합니다.",
  lore: "GATT는 BLE 연결 후 데이터를 계층(Profile > Service > Characteristic > Descriptor)으로 주고받는 표준 규격입니다.",
  link: "https://yalex-kim.github.io/connectivityBook/bluetooth/chapters/gatt.html",
  walkPos: new THREE.Vector3(0, SURFACE_Y, -6.2)
});

// ----- 3.2 📚 RF 이론 도서관 (Theory Library) -----
const library = new THREE.Group();
{
  const b = new THREE.Mesh(new THREE.BoxGeometry(3.0, 2.0, 2.6), plasterMat);
  b.position.y = 1.0;
  library.add(b);

  const door = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.08), woodMat);
  door.position.set(0.8, 0.7, 1.32);
  library.add(door);

  [-0.65, 0.1].forEach(wx => {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.7, 0.04), glassMat);
    win.position.set(wx, 1.1, 1.32);
    library.add(win);
  });

  const roof1 = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.4, 3.1), blueRoof);
  roof1.position.y = 2.15;
  library.add(roof1);

  const roof2 = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.4, 2.0), blueRoof);
  roof2.position.y = 2.5;
  library.add(roof2);

  const dome = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.8), darkStone);
  dome.position.set(-0.6, 2.85, 0);
  library.add(dome);

  const domeRod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.5, 6), metalMat);
  domeRod.position.set(-0.6, 3.3, 0);
  library.add(domeRod);
}
library.position.set(-9.0, SURFACE_Y, -1.0);
scene.add(library);

registerInteractive(library, {
  title: "📚 RF 이론 도서관",

// ---------- 6. 높이 인식 충돌 판정 (지형 칸 + 박스/원형 장애물) ----------
// 규칙: 목표 지점의 바닥/장애물 윗면이 "발 높이 + STEP_MAX"보다 높으면 벽, 아니면 올라선다.
const KNIGHT_RADIUS = 0.42;   // 장애물 충돌 반경
const FOOT_HALF = 0.3;        // 지형 칸 판정용 발바닥 반폭
const STEP_MAX = 0.55;        // 걸어서 오를 수 있는 최대 단차 (반 블록 OK, 한 블록은 점프)

// 사각 장애물 AABB 목록 — top: 윗면 절대 높이
const OBSTACLE_BOXES = [
  // GATT 중앙 회관 (0, -8.5)
  { minX: -2.0, maxX: 2.0, minZ: -10.2, maxZ: -7.0, top: SURFACE_Y + 3.4 },
  // RF 이론 도서관 (-9.0, -1.0)
  { minX: -10.6, maxX: -7.4, minZ: -2.4, maxZ: 0.4, top: SURFACE_Y + 3.2 },
  // 패킷 대장간 (9.0, -1.0)
  { minX: 7.4, maxX: 10.6, minZ: -2.4, maxZ: 0.4, top: SURFACE_Y + 2.8 },
  // 전파의 등대 (8.0, 8.0)
  { minX: 7.1, maxX: 8.9, minZ: 7.1, maxZ: 8.9, top: SURFACE_Y + 8.0 },
  // 호핑 던전 관문 (-9.0, -13.0) — 던전 구현(Stage 7) 전까지는 통과 불가
  { minX: -10.6, maxX: -7.4, minZ: -13.5, maxZ: -12.5, top: DUNGEON_PIT_Y + 3.3 }
];

// 원형 장애물 목록 — 분수대 수반(점프로 올라설 수 있음)·기둥, 나무, 가로등
const OBSTACLE_CIRCLES = [
  { x: 0, z: 0, r: 1.85, top: SURFACE_Y + 0.7 },
  { x: 0, z: 0, r: 0.45, top: SURFACE_Y + 1.7 },
  ...TREE_POSITIONS.map(([tx, tz, s]) => ({ x: tx, z: tz, r: 0.45, top: groundHeightAt(tx, tz) + 1.8 * s })),
  ...LAMP_POSITIONS.map(([lx, lz]) => ({ x: lx, z: lz, r: 0.12, top: groundHeightAt(lx, lz) + 2.0 }))
];

function boxOverlaps(b, x, z, pad) {
  return x >= b.minX - pad && x <= b.maxX + pad && z >= b.minZ - pad && z <= b.maxZ + pad;
}
function circleOverlaps(c, x, z, pad) {
  const d = c.r + pad;
  return (x - c.x) ** 2 + (z - c.z) ** 2 < d * d;
}

// 발바닥 4모서리가 걸치는 지형 칸 높이 목록
function footprintHeights(x, z) {
  return [
    groundHeightAt(x - FOOT_HALF, z - FOOT_HALF), groundHeightAt(x + FOOT_HALF, z - FOOT_HALF),
    groundHeightAt(x - FOOT_HALF, z + FOOT_HALF), groundHeightAt(x + FOOT_HALF, z + FOOT_HALF)
  ];
}

/** 발 높이 feetY인 기사가 (x, z)에 있을 수 없으면 true */
function isBlocked(x, z, feetY) {
  if (Math.hypot(x, z) > PLAY_RADIUS) return true;
  const climb = feetY + STEP_MAX;
  for (const h of footprintHeights(x, z)) if (h > climb) return true;
  for (const b of OBSTACLE_BOXES) if (b.top > climb && boxOverlaps(b, x, z, KNIGHT_RADIUS)) return true;
  for (const c of OBSTACLE_CIRCLES) if (c.top > climb && circleOverlaps(c, x, z, KNIGHT_RADIUS)) return true;
  return false;
}

/** (x, z)에서 발 높이 feetY 기준으로 딛고 설 수 있는 가장 높은 면 */
function supportHeightAt(x, z, feetY) {
  const climb = feetY + STEP_MAX;
  let best = -Infinity;
  for (const h of footprintHeights(x, z)) if (h <= climb && h > best) best = h;
  // 장애물 윗면은 중심점이 그 위에 있을 때만 받쳐준다 (가장자리에서 떨어질 수 있게)
  for (const b of OBSTACLE_BOXES) if (b.top <= climb && b.top > best && boxOverlaps(b, x, z, 0)) best = b.top;
  for (const c of OBSTACLE_CIRCLES) if (c.top <= climb && c.top > best && circleOverlaps(c, x, z, 0)) best = c.top;
  return best;
}

  performJump();
});

/** 최단 각도로 회전 보간 (±π 경계에서 반대로 한 바퀴 도는 문제 방지) */
function turnTowards(current, target, t) {
  const diff = Math.atan2(Math.sin(target - current), Math.cos(target - current));
  return current + diff * t;
}

/** 축 분리 슬라이딩 이동. 실제 이동량을 반환 */
function slideMove(stepX, stepZ) {
  const feetY = knight.position.y;
  // 이미 장애물 안에 끼어 있으면(스폰·텔레포트 등) 빠져나올 수 있도록 판정을 건너뛴다
  const stuck = isBlocked(knight.position.x, knight.position.z, feetY);
  const x0 = knight.position.x, z0 = knight.position.z;
  if (stuck || !isBlocked(x0 + stepX, z0, feetY)) knight.position.x += stepX;
  if (stuck || !isBlocked(knight.position.x, z0 + stepZ, feetY)) knight.position.z += stepZ;
  return Math.hypot(knight.position.x - x0, knight.position.z - z0);
}

function readMoveInput() {
  let right = 0, forward = 0;
  const pressed = (codes) => codes.some(c => keys.has(c));
  if (pressed(MOVE_CODES.right)) right += 1;
  if (pressed(MOVE_CODES.left)) right -= 1;
  if (pressed(MOVE_CODES.forward)) forward += 1;
  if (pressed(MOVE_CODES.back)) forward -= 1;
  if (joystick.active) {
    right = joystick.right;
    forward = joystick.forward;
  }
  return { right, forward };
}

function moveKnight(dt) {
  const input = readMoveInput();
  if (joystick.active) clearMoveTarget();
  const inputLen = Math.hypot(input.right, input.forward);

  let dirX = 0, dirZ = 0, speedScale = 0;

  if (inputLen > 0.05) {
    const fwdX = -Math.sin(cameraYaw), fwdZ = -Math.cos(cameraYaw);
    const rightX = Math.cos(cameraYaw), rightZ = -Math.sin(cameraYaw);
    const norm = inputLen > 1 ? 1 / inputLen : 1;
    dirX = rightX * input.right * norm + fwdX * input.forward * norm;
    dirZ = rightZ * input.right * norm + fwdZ * input.forward * norm;
    speedScale = Math.min(1, inputLen);
  } else if (targetDestination) {
    const dx = targetDestination.x - knight.position.x;
    const dz = targetDestination.z - knight.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 0.25) {
      dirX = dx / dist;
      dirZ = dz / dist;
      speedScale = Math.min(1, dist / (SPEED * dt)); // 목표 지점을 넘어가지 않게
    } else {
      arriveAtTarget();
    }
  }

  let moved = 0;
  if (speedScale > 0) {
    const len = Math.hypot(dirX, dirZ);
    moved = slideMove(dirX * SPEED * dt * speedScale, dirZ * SPEED * dt * speedScale);
    if (len > 0.0001) {
      knight.rotation.y = turnTowards(knight.rotation.y, Math.atan2(dirX, dirZ), Math.min(1, dt * 15));
    }
    // 클릭 이동 중 양 축이 모두 막히면 목표 도달 불가로 취소
    if (targetDestination && inputLen <= 0.05 && moved < 0.0001) clearMoveTarget();
  }
  const isMoving = moved > 0.0005;

  // ----- 수직 물리: 단차 오르내림 · 낙하 · 점프 -----
  const supportY = supportHeightAt(knight.position.x, knight.position.z, knight.position.y);

  if (isGrounded) {
    const diff = supportY - knight.position.y;
    if (diff < -STEP_MAX) {
      // 한 계단보다 큰 낙차 → 걸어 나가면 떨어진다
      isGrounded = false;
      velocityY = 0;
    } else if (Math.abs(diff) > 0.001) {
      knight.position.y += diff * Math.min(1, dt * STEP_SMOOTH);
      if (Math.abs(supportY - knight.position.y) < 0.01) knight.position.y = supportY;
    }
  }

  if (!isGrounded) {
    velocityY += GRAVITY * dt;
    knight.position.y += velocityY * dt;
    if (velocityY <= 0 && knight.position.y <= supportY) {
      knight.position.y = supportY;
      velocityY = 0;
      isGrounded = true;
      squashTime = LAND_SQUASH_TIME;
      triggerLandingEffect(knight.position.x, supportY, knight.position.z);
      badge.textContent = regionLabel();
    }
  }

  // ----- 애니메이션 (착지 스쿼시 / 체공 스트레치 / 보행 바운스) — 리그 전체에 적용 -----
  if (squashTime > 0) {
    squashTime -= dt;
    const p = Math.max(0, squashTime / LAND_SQUASH_TIME);
    knightRig.scale.set(1 + p * 0.22, 1 - p * 0.22, 1 + p * 0.22);
    knightRig.position.y = 0;
  } else if (!isGrounded) {
    const stretch = Math.min(0.18, Math.abs(velocityY) * 0.015);
    knightRig.scale.set(1 - stretch * 0.5, 1 + stretch, 1 - stretch * 0.5);
    knightRig.position.y = 0;
  } else if (isMoving) {
    walkAnimTime += dt * 14;
    knightRig.scale.set(1, 1, 1);
    knightRig.position.y = Math.abs(Math.sin(walkAnimTime)) * 0.06;
  } else {
    knightRig.scale.set(1, 1, 1);
    knightRig.position.y = 0;
  }
}

function regionLabel() {
  const { x, z, y } = knight.position;
  if (isDungeonCell(x, z)) return y < 0.6 ? "⚔️ 호핑 던전 입구 · 지하" : "⚔️ 호핑 던전 계단";
  if (Math.hypot(x, z) > VILLAGE_RADIUS) return "🏖️ 스펙트럼 해안";
  return "🛡️ GATT 빌리지 광장";
}

// ---------- 8. 카메라 추종 & 회전 ----------
// 점프·계단에서 화면이 덜컹이지 않도록 추종 높이만 부드럽게 따라간다
let cameraFocusY = SPAWN_POS.y;

function updateCamera(dt) {
  cameraFocusY += (knight.position.y - cameraFocusY) * Math.min(1, dt * 6);
  const hDist = cameraDistance * Math.cos(cameraPitch);
  const vDist = cameraDistance * Math.sin(cameraPitch);

  camera.position.set(
    knight.position.x + Math.sin(cameraYaw) * hDist,
    cameraFocusY + vDist,
    knight.position.z + Math.cos(cameraYaw) * hDist
  );
  camera.lookAt(knight.position.x, cameraFocusY + 1.0, knight.position.z);
}

// ---------- 9. 마우스 클릭 & 터치 인터랙션 ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const activePointers = new Map();
let initialPinchDist = 0;
let initialPinchCamDist = 15;
let isPinching = false;

let pointerDownPos = { x: 0, y: 0 };
let isDraggingCamera = false;
let isPointerDown = false;
let activePointerId = null;

// UI 오버레이는 #app 바깥 형제 요소이므로 여기로 이벤트가 오지 않는다
app.addEventListener("pointerdown", (e) => {
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 1) {
    isPointerDown = true;
    activePointerId = e.pointerId;
    pointerDownPos = { x: e.clientX, y: e.clientY };
    if (e.button === 2) isDraggingCamera = true;
  } else if (activePointers.size === 2) {
    isPinching = true;
    isDraggingCamera = false;
    isPointerDown = false;
    const pts = Array.from(activePointers.values());
    initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    initialPinchCamDist = cameraDistance;
  }
});

window.addEventListener("pointermove", (e) => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  if (isPinching && activePointers.size >= 2) {
    const pts = Array.from(activePointers.values());
    const curDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (curDist > 10 && initialPinchDist > 10) {
      const factor = initialPinchDist / curDist;
      cameraDistance = Math.max(6, Math.min(36, initialPinchCamDist * factor));
    }
    return;
  }

  if (!isPointerDown || e.pointerId !== activePointerId) return;

  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const dist = Math.hypot(dx, dy);

  if (dist > 8 || isDraggingCamera) {
    isDraggingCamera = true;
    cameraYaw -= dx * 0.006;
    cameraPitch = Math.max(0.15, Math.min(1.2, cameraPitch + dy * 0.005));
    pointerDownPos = { x: e.clientX, y: e.clientY };
  }
});

function handlePointerEnd(e) {
  activePointers.delete(e.pointerId);

  if (activePointers.size < 2) isPinching = false;

  if (e.pointerId === activePointerId) {
    if (isPointerDown && !isDraggingCamera && !isPinching && e.button !== 2) {
      handleClickOrTap(e.clientX, e.clientY);
    }
    isPointerDown = false;
    isDraggingCamera = false;
    activePointerId = null;
  }
}

window.addEventListener("pointerup", handlePointerEnd);
window.addEventListener("pointercancel", handlePointerEnd);

window.addEventListener("wheel", (e) => {
  cameraDistance = Math.max(6, Math.min(36, cameraDistance + e.deltaY * 0.015));
}, { passive: true });

window.addEventListener("contextmenu", (e) => e.preventDefault());

// 클릭 / 탭 핸들러
const modal = document.getElementById("info-modal");
const modalTitle = document.getElementById("modal-title");
const modalSub = document.getElementById("modal-sub");
const modalDesc = document.getElementById("modal-desc");
const modalLore = document.getElementById("modal-lore");
const modalLink = document.getElementById("modal-link");
document.getElementById("modal-close").addEventListener("click", () => {
  modal.style.display = "none";
});

function showInfoModal(data) {
  modalTitle.textContent = data.title;
  modalSub.textContent = data.sub;
  modalDesc.textContent = data.desc;
  modalLore.textContent = "📶 RF 이론: " + data.lore;
  modalLink.href = data.link;
  modal.style.display = "block";

  if (data.walkPos) {
    setMoveTarget(data.walkPos, `${data.title} 앞 도착`);
    badge.textContent = `🚶 ${data.title}(으)로 이동 중`;
  }
}

function findInteractiveAncestor(obj) {
  for (let o = obj; o; o = o.parent) {
    if (o.userData.interactive) return o.userData.interactive;
  }
  return null;
}

function handleClickOrTap(clientX, clientY) {
  pointer.x =  (clientX / window.innerWidth)  * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  // 건물·지형을 한 번에 검사해 화면에서 가장 앞에 있는 대상을 고른다
  const hits = raycaster.intersectObjects([...interactiveObjects, ...terrain.children, sea], true);
  if (hits.length === 0) return;

  const info = findInteractiveAncestor(hits[0].object);
  if (info) {
    showInfoModal(info);
    return;
  }

  const p = hits[0].point;
  const targetY = groundHeightAt(p.x, p.z);
  // 장애물 내부·이동 불가 지점 클릭은 무시
  if (!Number.isFinite(targetY) || isBlocked(p.x, p.z, targetY)) return;

  setMoveTarget(new THREE.Vector3(p.x, targetY, p.z), null);
  badge.textContent = `📍 이동 중 (${p.x.toFixed(1)}, ${p.z.toFixed(1)})`;
  modal.style.display = "none";
}

function setMoveTarget(pos, arrivalLabel) {
  targetDestination = pos;
  pendingArrivalLabel = arrivalLabel;
  targetMarker.position.set(pos.x, pos.y + 0.04, pos.z);
  targetMarker.visible = true;
}

function clearMoveTarget() {
  targetDestination = null;
  pendingArrivalLabel = null;
  targetMarker.visible = false;
}

function arriveAtTarget() {
  badge.textContent = pendingArrivalLabel ?? regionLabel();
  clearMoveTarget();
}

// 리셋 버튼
const btnReset = document.getElementById("btn-reset");
btnReset.addEventListener("click", () => {
  knight.position.copy(SPAWN_POS);
  knight.rotation.y = 0;
  cameraFocusY = SPAWN_POS.y;
  clearMoveTarget();
  cameraYaw = 0;
  cameraPitch = 0.52;
  velocityY = 0;
  isGrounded = true;
  modal.style.display = "none";
  badge.textContent = "🛡️ GATT 빌리지 광장 · 평지";
  btnReset.blur(); // 포커스가 남아 스페이스바가 버튼을 다시 누르지 않도록
});

// ---------- 10. 가상 조이스틱 이벤트 ----------
const joyZone = document.getElementById("joystick-zone");
const joyBase = document.getElementById("joystick-base");
const joyThumb = document.getElementById("joystick-thumb");

const JOY_MAX_DIST = 38;
let joyPointerId = null;
let joyCenter = { x: 0, y: 0 };

joyZone.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  e.stopPropagation();
  joyPointerId = e.pointerId;
  joyZone.setPointerCapture(joyPointerId);

  const rect = joyBase.getBoundingClientRect();
  joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  joystick.active = true;
  updateJoystick(e.clientX, e.clientY);
});

joyZone.addEventListener("pointermove", (e) => {
  if (e.pointerId !== joyPointerId) return;
  e.preventDefault();
  updateJoystick(e.clientX, e.clientY);
});

function endJoystick(e) {
  if (e.pointerId !== joyPointerId) return;
  joyPointerId = null;
  joystick.active = false;
  joystick.right = 0;
  joystick.forward = 0;
  joyThumb.style.transform = `translate(0px, 0px)`;
}
joyZone.addEventListener("pointerup", endJoystick);
joyZone.addEventListener("pointercancel", endJoystick);

function updateJoystick(clientX, clientY) {
  const dx = clientX - joyCenter.x;
  const dy = clientY - joyCenter.y;
  const dist = Math.hypot(dx, dy);

  const clampedDist = Math.min(dist, JOY_MAX_DIST);
  const angle = Math.atan2(dy, dx);

  const thumbX = Math.cos(angle) * clampedDist;
  const thumbY = Math.sin(angle) * clampedDist;
  joyThumb.style.transform = `translate(${thumbX}px, ${thumbY}px)`;

  const norm = clampedDist / JOY_MAX_DIST;
  joystick.right = (thumbX / JOY_MAX_DIST) * norm;
  joystick.forward = -(thumbY / JOY_MAX_DIST) * norm;
}

// ---------- 11. 렌더 루프 ----------
const clock = new THREE.Clock();

// ?test 모드: 실시간 루프는 렌더만 하고, 시뮬레이션은 __PK.tick()으로 고정 스텝 진행 (FPS와 무관한 결정적 테스트)
const TEST_MODE = new URLSearchParams(location.search).has("test");
const FIXED_DT = 1 / 60;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (!TEST_MODE) {
    moveKnight(dt);
    updateCamera(dt);
  }

  const t = clock.elapsedTime;
  // 비콘 점멸
  tower.userData.beacon.material.color.setHSL(0.55, 0.9, 0.45 + 0.35 * Math.sin(t * 3.5));
  // 분수대 중앙 블루투스 룬 회전
  fountain.userData.rune.rotation.y = t * 1.5;
  fountain.userData.rune.position.y = 1.5 + Math.sin(t * 2.5) * 0.08;
  // 포털 소용돌이 맥동
  dungeonGate.userData.portal.scale.set(1 + 0.06 * Math.sin(t * 4), 1 + 0.06 * Math.cos(t * 3), 1);
  sea.position.z = Math.sin(t * 0.3) * 0.4;

  if (targetMarker.visible) {
    targetMarker.rotation.y = t * 2;
    const s = 1 + 0.15 * Math.sin(t * 6);
    targetMarker.scale.set(s, 1, s);
  }

  // 착지 충격파 링 애니메이션
  if (landingRingTimer > 0) {
    landingRingTimer -= dt;
    const progress = 1 - (landingRingTimer / 0.28);
    const s = 1 + progress * 2.4;
    landingRing.scale.set(s, s, 1);
    landingRing.material.opacity = Math.max(0, 0.85 * (1 - progress));
    if (landingRingTimer <= 0) landingRing.visible = false;
  }

  // 테스트 모드에서는 헤드리스 소프트웨어 렌더링 비용을 피하기 위해 그리지 않는다
  if (!TEST_MODE) renderer.render(scene, camera);
}
animate();

// 자동 스모크 테스트(scripts/smoke.mjs)용 읽기 전용 관찰 훅
window.__PK = {
  knight, SPAWN_POS, STEP_MAX,
  groundHeightAt, isBlocked, supportHeightAt,
  state: () => ({
    x: knight.position.x, y: knight.position.y, z: knight.position.z,
    rotY: knight.rotation.y, grounded: isGrounded, vy: velocityY,
    badge: badge.textContent, modal: modal.style.display === "block" ? modalTitle.textContent : null
  }),
  /** 시뮬레이션을 seconds 만큼 고정 스텝으로 진행 (테스트 모드용) */
  tick: (seconds) => {
    for (let n = Math.round(seconds / FIXED_DT); n > 0; n--) {
      moveKnight(FIXED_DT);
      updateCamera(FIXED_DT);
    }
    scene.updateMatrixWorld(); // 렌더를 생략하므로 레이캐스트용 행렬을 직접 갱신
  },
  projectToScreen: (x, y, z) => {
    updateCamera(0);
    scene.updateMatrixWorld();
    const v = new THREE.Vector3(x, y, z).project(camera);
    return { x: (v.x + 1) / 2 * window.innerWidth, y: (1 - v.y) / 2 * window.innerHeight };
  }
};

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
