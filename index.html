    margin: 0; height: 100%; overflow: hidden; background: #0b1524;

    width: 110px; height: 110px; border-radius: 50%;

  /* 건물/던전 상호작용 정보 모달 (하단 중앙) */
  #info-modal {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);

    background: rgba(8, 20, 38, 0.92);

    display: none; animation: popUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);

  @keyframes popUp {
    from { opacity: 0; transform: translate(-50%, 15px) scale(0.96); }
    to { opacity: 1; transform: translate(-50%, 0) scale(1); }
  }
  #info-modal .modal-header {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid #1b3554; padding-bottom: 8px; margin-bottom: 8px;
  }
  #info-modal .modal-title { font-size: 15px; font-weight: 700; color: #7dd8ff; }
  #info-modal .modal-sub { font-size: 11px; color: #9bc0e4; margin-left: 6px; }
  #info-modal .modal-close {
    background: none; border: none; color: #7c9bba; font-size: 18px;

  #info-modal .modal-desc { font-size: 12.5px; line-height: 1.55; color: #c4dcf5; margin-bottom: 10px; }
  #info-modal .modal-lore {
    font-size: 11.5px; color: #8bb6e2; background: rgba(14, 34, 60, 0.6);
    border-left: 3px solid #39d0ff; padding: 6px 10px; border-radius: 4px; margin-bottom: 10px;
  }
  #info-modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  #info-modal .btn-action {
    background: #1b4777; color: #e2f1ff; border: 1px solid #2d6fb3;

  #info-modal .btn-action:hover { background: #235d9c; }

<div id="app"></div>

<script type="module">
import * as THREE from "three";

// ============================================================
// Packet Knight — Stage 2: GATT 빌리지 & 던전 입구
// PRD.md §7 Stage 2 DoD:
// "마을 구역이 반듯한 평지로 정리되고, 지하 던전 입구가 생기며,
//  각 건물과 입구 클릭 시 이름과 블루투스 역할 툴팁이 뜬다"
// ============================================================

// ---------- 1. 씬 & 렌더러 ----------
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ec9e8);
scene.fog = new THREE.Fog(0x8ec9e8, 70, 160);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 350);

// 조명 (따뜻한 햇살 + 환경광)
const sun = new THREE.DirectionalLight(0xfff5dd, 1.6);
sun.position.set(40, 60, 30);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xc6e0ff, 0.65));
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x3f6b3a, 0.5));

// ---------- 2. 지형: 평지 GATT 빌리지 + 지하 던전 계단 + 해안 ----------
const ISLAND_RADIUS = 16;
const VILLAGE_RADIUS = 10.5; // 마을 평지 반경
const VILLAGE_HEIGHT = 2;    // 마을 평지 높이 y = 2
const SEA_LEVEL = 0;

// 던전 입구 위치 및 계단 범위
const DUNGEON_X = -4;
const DUNGEON_Z = -9.5;

export function groundHeightAt(x, z) {
  // 1) 던전 계단 및 입구 구역 판정
  const dx = x - DUNGEON_X;
  const dz = z - DUNGEON_Z;
  if (Math.abs(dx) <= 1.8 && dz >= -3.5 && dz <= 1.5) {
    // dz: 1.5 (마을 평지 y=2) -> -3.5 (던전 바닥 y=-0.5)
    const t = THREE.MathUtils.clamp((1.5 - dz) / 5.0, 0, 1);
    return VILLAGE_HEIGHT - t * 2.5;
  }

  // 2) 마을 평지 고원
  const r = Math.hypot(x, z);
  if (r <= VILLAGE_RADIUS) {
    return VILLAGE_HEIGHT;
  }

  // 3) 외곽 경사로 & 해안선
  const drop = Math.min(2.5, (r - VILLAGE_RADIUS) * 0.5);
  const h = VILLAGE_HEIGHT - drop;
  return h;
}

// 재질 정의
const grassMat  = new THREE.MeshLambertMaterial({ color: 0x5ea840 }); // 초록 잔디
const pathMat   = new THREE.MeshLambertMaterial({ color: 0x8a929b }); // 석판 자갈길
const sandMat   = new THREE.MeshLambertMaterial({ color: 0xd9c78a }); // 해변 모래
const dirtMat   = new THREE.MeshLambertMaterial({ color: 0x8a6a45 }); // 흙
const stoneMat  = new THREE.MeshLambertMaterial({ color: 0x6e737b }); // 석조 돌
const darkStone = new THREE.MeshLambertMaterial({ color: 0x2b2f36 }); // 던전 흑석
const waterMat  = new THREE.MeshLambertMaterial({ color: 0x226cb5, transparent: true, opacity: 0.86 });

// 복셀 레이어 빌더
function buildVoxelLayer(list, material) {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mesh = new THREE.InstancedMesh(geo, material, list.length);
  const m = new THREE.Matrix4();
  list.forEach((p, i) => {
    m.makeTranslation(p[0] + 0.5, p[1] + 0.5, p[2] + 0.5);
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  return mesh;
}

const layer = { grass: [], path: [], sand: [], dirt: [], stone: [], darkStone: [] };

for (let x = -ISLAND_RADIUS; x <= ISLAND_RADIUS; x++) {
  for (let z = -ISLAND_RADIUS; z <= ISLAND_RADIUS; z++) {
    const r = Math.hypot(x, z);
    if (r > ISLAND_RADIUS) continue;

    // 던전 입구 구역 복셀 처리
    const dx = x - DUNGEON_X;
    const dz = z - DUNGEON_Z;
    const isDungeonPit = Math.abs(dx) <= 2 && dz >= -4 && dz <= 2;

    let h = Math.round(groundHeightAt(x, z));

    if (isDungeonPit) {
      // 던전 계단 통로
      layer.darkStone.push([x, h, z]);
      for (let y = h - 1; y >= -3; y--) layer.stone.push([x, y, z]);
      continue;
    }

    // 길(석판) 판정: 마을 중앙 십자로 및 주요 경로
    const isMainCross = (Math.abs(x) <= 1 && z >= -7 && z <= 5) || (Math.abs(z) <= 1 && x >= -7 && x <= 7);
    const isDungeonPath = (z <= -6 && Math.abs(x - DUNGEON_X) <= 1);
    const isPath = r <= VILLAGE_RADIUS && (isMainCross || isDungeonPath);

    let topType = "grass";
    if (r > VILLAGE_RADIUS + 2.5) topType = "sand";
    else if (isPath) topType = "path";
    else topType = "grass";

    layer[topType].push([x, h, z]);

    // 하부 채우기
    const depth = topType === "sand" ? 2 : 3;
    for (let d = 1; d <= depth; d++) {
      const y = h - d;
      if (y < -4) break;
      if (d === depth) layer.stone.push([x, y, z]);
      else layer[topType === "sand" ? "sand" : "dirt"].push([x, y, z]);
    }
  }
}

const terrain = new THREE.Group();
terrain.add(buildVoxelLayer(layer.grass,     grassMat));
terrain.add(buildVoxelLayer(layer.path,      pathMat));
terrain.add(buildVoxelLayer(layer.sand,      sandMat));
terrain.add(buildVoxelLayer(layer.dirt,      dirtMat));
terrain.add(buildVoxelLayer(layer.stone,     stoneMat));
terrain.add(buildVoxelLayer(layer.darkStone, darkStone));
scene.add(terrain);

// 바다 (넓은 평면)
const sea = new THREE.Mesh(new THREE.PlaneGeometry(450, 450), waterMat);
sea.rotation.x = -Math.PI / 2;
sea.position.y = SEA_LEVEL - 0.25;
scene.add(sea);

// ---------- 3. 인터랙티브 오브젝트 관리 ----------
const interactiveObjects = [];

function registerInteractive(meshOrGroup, data) {
  meshOrGroup.userData.interactive = data;
  interactiveObjects.push(meshOrGroup);
}

// 공용 건물 복셀 재질
const woodMat   = new THREE.MeshLambertMaterial({ color: 0x7a4f2b }); // 목재 벽/기둥
const plasterMat= new THREE.MeshLambertMaterial({ color: 0xecf0f2 }); // 회벽
const redRoof   = new THREE.MeshLambertMaterial({ color: 0xb53c30 }); // 적색 지붕
const blueRoof  = new THREE.MeshLambertMaterial({ color: 0x24558f }); // 청색 지붕
const copperRoof= new THREE.MeshLambertMaterial({ color: 0xbf5d28 }); // 대장간 구리 지붕
const glassMat  = new THREE.MeshBasicMaterial({ color: 0xffea88 });   // 창문 (따뜻한 불빛)
const cyanEmblem= new THREE.MeshBasicMaterial({ color: 0x39d0ff });   // 블루투스 심볼
const metalMat  = new THREE.MeshLambertMaterial({ color: 0xb5c1cd });

// ----- 3.1 🏛️ GATT 중앙 회관 (Central Service Hall) -----
const hall = new THREE.Group();
{
  // 1층 본체 (회벽 + 나무 기둥)
  const b1 = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 5), plasterMat);
  b1.position.y = 1.5;
  hall.add(b1);

  // 1층 모서리 기둥 4개
  const pOff = [[-2.9, -2.4], [2.9, -2.4], [-2.9, 2.4], [2.9, 2.4]];
  pOff.forEach(([px, pz]) => {
    const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.5, 3.2, 0.5), woodMat);
    pillar.position.set(px, 1.6, pz);
    hall.add(pillar);
  });

  // 문 (오크 목재)
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.0, 0.1), woodMat);
  door.position.set(0, 1.0, 2.55);
  hall.add(door);

  // 정면 창문 2개
  [-1.8, 1.8].forEach(wx => {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.05), glassMat);
    win.position.set(wx, 1.8, 2.53);
    hall.add(win);
  });

  // 지붕 (박공 지붕 형태 3단)
  const r1 = new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.6, 5.6), redRoof);
  r1.position.y = 3.3;
  hall.add(r1);

  const r2 = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.6, 4.2), redRoof);
  r2.position.y = 3.8;
  hall.add(r2);

  const r3 = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.6, 2.8), redRoof);
  r3.position.y = 4.3;
  hall.add(r3);

  // 상단 GATT 룬 심볼
  const rune = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), cyanEmblem);
  rune.position.set(0, 4.9, 0);
  hall.add(rune);
}
hall.position.set(0, VILLAGE_HEIGHT, -3.5);
scene.add(hall);

registerInteractive(hall, {
  title: "🏛️ GATT 중앙 회관",
  sub: "[데이터 프로필 허브]",
  desc: "스펙트럼 대륙의 모든 서비스(Service)와 특성(Characteristic)이 등록되는 행정 중앙 회관입니다. 시민 NPC들에게 데이터를 읽기(Read), 쓰기(Write), 알림(Notify) 받는 퀘스트를 수주합니다.",
  lore: "GATT는 BLE 연결 후 데이터를 계층(Profile > Service > Characteristic > Descriptor)으로 주고받는 표준 규격입니다.",
  link: "https://yalex-kim.github.io/connectivityBook/bluetooth/chapters/gatt.html",
  walkPos: new THREE.Vector3(0, VILLAGE_HEIGHT, -0.5)
});

// ----- 3.2 📚 RF 이론 도서관 (Theory Library) -----
const library = new THREE.Group();
{
  const b = new THREE.Mesh(new THREE.BoxGeometry(5, 2.8, 4), plasterMat);
  b.position.y = 1.4;
  library.add(b);

  // 문
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.1), woodMat);
  door.position.set(1.4, 0.9, 2.05);
  library.add(door);

  // 책 모양 창문
  [-1.2, 0.2].forEach(wx => {
    const win = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.1, 0.05), glassMat);
    win.position.set(wx, 1.5, 2.03);
    library.add(win);
  });

  // 청색 지붕
  const roof1 = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.5, 4.6), blueRoof);
  roof1.position.y = 3.0;
  library.add(roof1);

  const roof2 = new THREE.Mesh(new THREE.BoxGeometry(4.0, 0.5, 3.2), blueRoof);
  roof2.position.y = 3.45;
  library.add(roof2);

  // 지붕 위 작은 안테나 관측탑
  const dome = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.0, 1.4), darkStone);
  dome.position.set(-1.2, 4.0, 0);
  library.add(dome);
}
library.position.set(-5.8, VILLAGE_HEIGHT, 0);
scene.add(library);

registerInteractive(library, {
  title: "📚 RF 이론 도서관",
  sub: "[connectivityBook 연동 연구소]",
  desc: "2.4GHz 무선통신의 모든 원리가 기록된 지식의 성소입니다. 챕터 퀴즈를 풀면 스탯(TX 파워, 수신 감도)이 오르고 새로운 스킬 슬롯이 해금됩니다.",
  lore: "무선 통신 교과서 connectivityBook 15개 챕터의 원문 지식이 인터랙티브하게 보관되어 있습니다.",
  link: "https://yalex-kim.github.io/connectivityBook/bluetooth/chapters/intro.html",
  walkPos: new THREE.Vector3(-4.0, VILLAGE_HEIGHT, 0)
});

// ----- 3.3 🔨 패킷 대장간 (Packet Forge & Battery Shop) -----
const forge = new THREE.Group();
{
  const b = new THREE.Mesh(new THREE.BoxGeometry(4.8, 2.6, 4), darkStone);
  b.position.y = 1.3;
  forge.add(b);

  // 주황 구리 지붕
  const r = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.6, 4.5), copperRoof);
  r.position.y = 2.8;
  forge.add(r);

  // 돌 굴뚝
  const chimney = new THREE.Mesh(new THREE.BoxGeometry(1.0, 3.6, 1.0), stoneMat);
  chimney.position.set(1.5, 2.2, -1.2);
  forge.add(chimney);

  // 모루 (야외)
  const anvil = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.4), metalMat);
  anvil.position.set(-1.6, 0.3, 2.6);
  forge.add(anvil);

  // 화로 불빛
  const fire = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshBasicMaterial({ color: 0xff6600 }));
  fire.position.set(0.5, 0.5, 2.05);
  forge.add(fire);
}
forge.position.set(5.8, VILLAGE_HEIGHT, 0);
scene.add(forge);

registerInteractive(forge, {
  title: "🔨 패킷 대장간",
  sub: "[장비 강화 & 배터리 상점]",

// ----- 3.6 복셀 나무 & 가로등 데코레이션 -----

// ---------- 4. 주인공 큐브 나이트 ----------
const knight = new THREE.Group();
{
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshLambertMaterial({ color: 0xd8443c }) // 기사 붉은 갑옷

const SPAWN_POS = new THREE.Vector3(0, VILLAGE_HEIGHT, 1.0);

// ---------- 5. 클릭/터치 이동 목표 지점 마커 ----------
const targetMarker = new THREE.Group();
{
  const ringGeo = new THREE.RingGeometry(0.35, 0.55, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x39d0ff, side: THREE.DoubleSide, transparent: true, opacity: 0.85
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  targetMarker.add(ring);

  const dotGeo = new THREE.CircleGeometry(0.12, 16);
  const dotMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.95
  });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  dot.rotation.x = -Math.PI / 2;
  targetMarker.add(dot);
}
targetMarker.visible = false;
scene.add(targetMarker);

let targetDestination = null;

// ---------- 6. 통합 이동 및 조작 시스템 ----------
const keys = new Set();
window.addEventListener("keydown", (e) => {
  keys.add(e.key.toLowerCase());
  targetDestination = null;
  targetMarker.visible = false;
});
window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

const joystick = { right: 0, forward: 0, active: false };

let cameraYaw = 0;
let cameraPitch = 0.52;
let cameraDistance = 14;

const SPEED = 6.5;

function moveKnight(dt) {
  let rightInput = 0;
  let forwardInput = 0;

  if (keys.has("d") || keys.has("arrowright")) rightInput += 1;
  if (keys.has("a") || keys.has("arrowleft"))  rightInput -= 1;
  if (keys.has("w") || keys.has("arrowup"))    forwardInput += 1;
  if (keys.has("s") || keys.has("arrowdown"))  forwardInput -= 1;

  if (joystick.active) {
    rightInput = joystick.right;
    forwardInput = joystick.forward;
    targetDestination = null;
    targetMarker.visible = false;
  }

  const inputLen = Math.hypot(rightInput, forwardInput);

  if (inputLen > 0.05) {
    const fwdX = -Math.sin(cameraYaw);
    const fwdZ = -Math.cos(cameraYaw);
    const rightX = Math.cos(cameraYaw);
    const rightZ = -Math.sin(cameraYaw);

    const norm = inputLen > 1 ? 1 / inputLen : 1;
    const nx = rightInput * norm;
    const nz = forwardInput * norm;

    const worldDir = new THREE.Vector3(
      rightX * nx + fwdX * nz,
      0,
      rightZ * nx + fwdZ * nz
    ).normalize();

    knight.position.addScaledVector(worldDir, SPEED * dt * Math.min(1, inputLen));

    const targetRotY = Math.atan2(worldDir.x, worldDir.z);
    knight.rotation.y = THREE.MathUtils.lerp(knight.rotation.y, targetRotY, Math.min(1, dt * 15));
  } else if (targetDestination) {
    const diff = targetDestination.clone().sub(knight.position);
    diff.y = 0;
    const dist = diff.length();

    if (dist > 0.25) {
      diff.normalize();
      knight.position.addScaledVector(diff, SPEED * dt);
      const targetRotY = Math.atan2(diff.x, diff.z);
      knight.rotation.y = THREE.MathUtils.lerp(knight.rotation.y, targetRotY, Math.min(1, dt * 15));
    } else {
      targetDestination = null;
      targetMarker.visible = false;
    }
  }

  // 지형 스냅 (평지 고원 및 계단 부드럽게 오르내리기)
  const targetY = groundHeightAt(knight.position.x, knight.position.z);
  knight.position.y += (targetY - knight.position.y) * Math.min(1, dt * 12);
}

// ---------- 7. 카메라 추종 & 회전 ----------
function updateCamera(dt) {
  const hDist = cameraDistance * Math.cos(cameraPitch);
  const vDist = cameraDistance * Math.sin(cameraPitch);

  const desiredX = knight.position.x + Math.sin(cameraYaw) * hDist;
  const desiredY = knight.position.y + vDist;
  const desiredZ = knight.position.z + Math.cos(cameraYaw) * hDist;

  camera.position.set(desiredX, desiredY, desiredZ);
  camera.lookAt(knight.position.x, knight.position.y + 1.2, knight.position.z);
}

// ---------- 8. 마우스 클릭 & 터치 인터랙션 ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const activePointers = new Map();
let initialPinchDist = 0;
let initialPinchCamDist = 14;
let isPinching = false;

let pointerDownPos = { x: 0, y: 0 };
let isDraggingCamera = false;
let isPointerDown = false;
let activePointerId = null;

app.addEventListener("pointerdown", (e) => {
  if (e.target.closest("#joystick-zone") || e.target.closest("#btn-reset") || e.target.closest("#info-modal")) return;

  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 1) {
    isPointerDown = true;
    activePointerId = e.pointerId;
    pointerDownPos = { x: e.clientX, y: e.clientY };
    if (e.button === 2) isDraggingCamera = true;
  } else if (activePointers.size === 2) {
    isPinching = true;
    isDraggingCamera = false;
    isPointerDown = false;
    const pts = Array.from(activePointers.values());
    initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    initialPinchCamDist = cameraDistance;
  }
});

window.addEventListener("pointermove", (e) => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  if (isPinching && activePointers.size >= 2) {
    const pts = Array.from(activePointers.values());
    const curDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (curDist > 10 && initialPinchDist > 10) {
      const factor = initialPinchDist / curDist;
      cameraDistance = Math.max(6, Math.min(32, initialPinchCamDist * factor));
    }
    return;
  }

  if (!isPointerDown || e.pointerId !== activePointerId) return;

  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const dist = Math.hypot(dx, dy);

  // 드래그 시점 회전 (위아래는 원래 방향, 좌우는 사용자 반전 방향 반영)
  if (dist > 8 || isDraggingCamera) {
    isDraggingCamera = true;
    cameraYaw -= dx * 0.006;
    cameraPitch = Math.max(0.15, Math.min(1.2, cameraPitch + dy * 0.005));
    pointerDownPos = { x: e.clientX, y: e.clientY };
  }
});

function handlePointerEnd(e) {
  activePointers.delete(e.pointerId);

  if (activePointers.size < 2) isPinching = false;

  if (e.pointerId === activePointerId) {
    if (isPointerDown && !isDraggingCamera && !isPinching && e.button !== 2) {
      handleClickOrTap(e.clientX, e.clientY);
    }
    isPointerDown = false;
    isDraggingCamera = false;
    activePointerId = null;
  }
}

window.addEventListener("pointerup", handlePointerEnd);
window.addEventListener("pointercancel", handlePointerEnd);

window.addEventListener("wheel", (e) => {
  cameraDistance = Math.max(6, Math.min(32, cameraDistance + e.deltaY * 0.015));
}, { passive: true });

window.addEventListener("contextmenu", (e) => e.preventDefault());

// 클릭 / 탭 핸들러 (오브젝트 클릭 vs 바닥 이동)
const modal = document.getElementById("info-modal");
const modalTitle = document.getElementById("modal-title");
const modalSub = document.getElementById("modal-sub");
const modalDesc = document.getElementById("modal-desc");
const modalLore = document.getElementById("modal-lore");
const modalLink = document.getElementById("modal-link");
document.getElementById("modal-close").addEventListener("click", () => {
  modal.style.display = "none";
});

function showInfoModal(data) {
  modalTitle.textContent = data.title;
  modalSub.textContent = data.sub;
  modalDesc.textContent = data.desc;
  modalLore.textContent = "📶 RF 이론: " + data.lore;
  modalLink.href = data.link;
  modal.style.display = "block";

  const badge = document.getElementById("badge");
  badge.textContent = `${data.title} 앞 도착`;

  if (data.walkPos) {
    setMoveTarget(data.walkPos);
  }
}

function handleClickOrTap(clientX, clientY) {
  pointer.x =  (clientX / window.innerWidth)  * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  // 1순위: 인터랙티브 건물/오브젝트 검사
  for (const obj of interactiveObjects) {
    const hits = raycaster.intersectObject(obj, true);
    if (hits.length > 0) {
      showInfoModal(obj.userData.interactive);
      return;
    }
  }

  // 2순위: 지형 바닥 클릭 이동
  const hits = raycaster.intersectObjects([sea, ...terrain.children], true);
  if (hits.length > 0) {
    const p = hits[0].point;
    const targetY = groundHeightAt(p.x, p.z);
    setMoveTarget(new THREE.Vector3(p.x, targetY, p.z));
    document.getElementById("badge").textContent = `📍 이동 중 (${p.x.toFixed(1)}, ${p.z.toFixed(1)})`;
    modal.style.display = "none";
  }
}

function setMoveTarget(pos) {
  targetDestination = pos;
  targetMarker.position.set(pos.x, pos.y + 0.08, pos.z);
  targetMarker.visible = true;
}

// 리셋 버튼
document.getElementById("btn-reset").addEventListener("click", () => {
  knight.position.copy(SPAWN_POS);
  targetDestination = null;
  targetMarker.visible = false;
  cameraYaw = 0;
  cameraPitch = 0.52;
  modal.style.display = "none";
  document.getElementById("badge").textContent = "🛡️ GATT 빌리지 광장 · 평지";
});

// ---------- 9. 가상 조이스틱 이벤트 ----------
const joyZone = document.getElementById("joystick-zone");
const joyBase = document.getElementById("joystick-base");
const joyThumb = document.getElementById("joystick-thumb");

const JOY_MAX_DIST = 38;
let joyPointerId = null;
let joyCenter = { x: 0, y: 0 };

joyZone.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  e.stopPropagation();
  joyPointerId = e.pointerId;
  joyZone.setPointerCapture(joyPointerId);

  const rect = joyBase.getBoundingClientRect();
  joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  joystick.active = true;
  updateJoystick(e.clientX, e.clientY);
});

joyZone.addEventListener("pointermove", (e) => {
  if (e.pointerId !== joyPointerId) return;
  e.preventDefault();
  updateJoystick(e.clientX, e.clientY);
});

function endJoystick(e) {
  if (e.pointerId !== joyPointerId) return;
  joyPointerId = null;
  joystick.active = false;
  joystick.right = 0;
  joystick.forward = 0;
  joyThumb.style.transform = `translate(0px, 0px)`;
}
joyZone.addEventListener("pointerup", endJoystick);
joyZone.addEventListener("pointercancel", endJoystick);

function updateJoystick(clientX, clientY) {
  const dx = clientX - joyCenter.x;
  const dy = clientY - joyCenter.y;
  const dist = Math.hypot(dx, dy);

  const clampedDist = Math.min(dist, JOY_MAX_DIST);
  const angle = Math.atan2(dy, dx);

  const thumbX = Math.cos(angle) * clampedDist;
  const thumbY = Math.sin(angle) * clampedDist;
  joyThumb.style.transform = `translate(${thumbX}px, ${thumbY}px)`;

  const norm = clampedDist / JOY_MAX_DIST;
  joystick.right = (thumbX / JOY_MAX_DIST) * norm;
  joystick.forward = -(thumbY / JOY_MAX_DIST) * norm;
}

// ---------- 10. 렌더 루프 ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  moveKnight(dt);
  updateCamera(dt);

  const t = clock.elapsedTime;
  // 비콘 점멸
  tower.userData.beacon.material.color.setHSL(0.55, 0.9, 0.45 + 0.35 * Math.sin(t * 3.5));
  // 포털 소용돌이 맥동
  dungeonGate.userData.portal.scale.set(1 + 0.06 * Math.sin(t * 4), 1 + 0.06 * Math.cos(t * 3), 1);
  sea.position.z = Math.sin(t * 0.3) * 0.4;

  if (targetMarker.visible) {
    targetMarker.rotation.y = t * 2;
    const s = 1 + 0.15 * Math.sin(t * 6);
    targetMarker.scale.set(s, 1, s);
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
