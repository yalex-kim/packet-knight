  /* 건물/던전 상호작용 정보 모달 (하단 중앙) */
  #info-modal {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);

  #info-modal .modal-header {

  #info-modal .modal-close {

<script type="module">
import * as THREE from "three";

// ============================================================
// Packet Knight — Stage 3: 캐릭터 컨트롤 고도화
// PRD.md §7 Stage 3 DoD:
// "큐브가 지형 단차를 오르내리고, 점프를 뛰며,
//  건물과 분수대, 나무에 부딪히며 자연스럽게 미끄러진다."
// ============================================================

// ---------- 1. 씬 & 렌더러 ----------
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ec9e8);
scene.fog = new THREE.Fog(0x8ec9e8, 90, 220);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 400);

// 조명 (따뜻한 햇살 + 환경광)
const sun = new THREE.DirectionalLight(0xfff5dd, 1.65);
sun.position.set(50, 75, 40);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xc6e0ff, 0.65));
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x3f6b3a, 0.55));

// ---------- 2. 지형 규격 및 높이 계산 함수 ----------
const ISLAND_RADIUS = 26;
const VILLAGE_RADIUS = 16.5; // 마을 평지 반경
const SURFACE_Y = 2.0;       // 마을 평지 표면 높이
const DUNGEON_PIT_Y = -0.5;  // 지하 던전 바닥 표면 높이
const SEA_LEVEL = 0;

// 던전 입구 위치 및 계단 구역 (북서쪽 외곽)
const DUNGEON_X = -9.0;
const DUNGEON_Z = -13.0;

/**
 * 임의의 (x, z) 위치에서 실제 밟는 지표면(Top Face) 높이 Y를 반환
 */
export function groundHeightAt(x, z) {
  // 1) 던전 계단 및 지하 pit 통로 (x: DUNGEON_X 근방, z: -8 ~ -14)
  const dx = x - DUNGEON_X;
  const dz = z - DUNGEON_Z;
  if (Math.abs(dx) <= 2.2 && z >= -14.5 && z <= -8.0) {
    const t = THREE.MathUtils.clamp((-8.0 - z) / 5.5, 0, 1);
    return SURFACE_Y - t * (SURFACE_Y - DUNGEON_PIT_Y);
  }

  // 2) 마을 평지 고원 광장
  const r = Math.hypot(x, z);
  if (r <= VILLAGE_RADIUS) {
    return SURFACE_Y;
  }

  // 3) 외곽 완만한 경사로 & 해안 모래사장
  const drop = Math.min(2.5, (r - VILLAGE_RADIUS) * 0.35);
  return SURFACE_Y - drop;
}

// 재질 정의
const grassMat  = new THREE.MeshLambertMaterial({ color: 0x5ea840 });
const pathMat   = new THREE.MeshLambertMaterial({ color: 0x8f98a2 });
const plazaMat  = new THREE.MeshLambertMaterial({ color: 0xa8b1bc });
const sandMat   = new THREE.MeshLambertMaterial({ color: 0xd9c78a });
const dirtMat   = new THREE.MeshLambertMaterial({ color: 0x8a6a45 });
const stoneMat  = new THREE.MeshLambertMaterial({ color: 0x6e737b });
const darkStone = new THREE.MeshLambertMaterial({ color: 0x2b2f36 });
const waterMat  = new THREE.MeshLambertMaterial({ color: 0x226cb5, transparent: true, opacity: 0.88 });

// 복셀 레이어 빌더
function buildVoxelLayer(list, material) {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mesh = new THREE.InstancedMesh(geo, material, list.length);
  const m = new THREE.Matrix4();
  list.forEach((p, i) => {
    m.makeTranslation(p[0] + 0.5, p[1] + 0.5, p[2] + 0.5);
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  return mesh;
}

const layer = { grass: [], path: [], plaza: [], sand: [], dirt: [], stone: [], darkStone: [] };

for (let x = -ISLAND_RADIUS; x <= ISLAND_RADIUS; x++) {
  for (let z = -ISLAND_RADIUS; z <= ISLAND_RADIUS; z++) {
    const r = Math.hypot(x, z);
    if (r > ISLAND_RADIUS) continue;

    const surfH = groundHeightAt(x, z);
    const topVoxelY = Math.round(surfH) - 1;

    const dx = x - DUNGEON_X;
    const isDungeonPit = Math.abs(dx) <= 2.2 && z >= -14.5 && z <= -8.0;

    if (isDungeonPit) {
      layer.darkStone.push([x, topVoxelY, z]);
      for (let y = topVoxelY - 1; y >= -4; y--) layer.stone.push([x, y, z]);
      continue;
    }

    const isCentralPlaza = r <= 3.2;
    const isNorthAve = Math.abs(x) <= 1 && z >= -9 && z <= 0;
    const isSouthAve = Math.abs(x) <= 1 && z >= 0 && z <= 8;
    const isEastWestAve = (z >= -2 && z <= 0) && (x >= -10 && x <= 10);
    const isDungeonRoad = (z <= -4 && z >= -8) && Math.abs(x - (DUNGEON_X * ((-4 - z) / 4.0))) <= 1.2;
    const isBeaconRoad = (z >= 4 && z <= 9) && Math.abs(x - (8.0 * ((z - 4) / 4.0))) <= 1.2;

    const isRoad = isNorthAve || isSouthAve || isEastWestAve || isDungeonRoad || isBeaconRoad;

    let topType = "grass";
    if (r > VILLAGE_RADIUS + 2.5) {
      topType = "sand";
    } else if (isCentralPlaza) {
      topType = "plaza";
    } else if (isRoad) {
      topType = "path";
    } else {
      topType = "grass";
    }

    layer[topType].push([x, topVoxelY, z]);

    const depth = topType === "sand" ? 2 : 3;
    for (let d = 1; d <= depth; d++) {
      const y = topVoxelY - d;
      if (y < -4) break;
      if (d === depth) layer.stone.push([x, y, z]);
      else layer[topType === "sand" ? "sand" : "dirt"].push([x, y, z]);
    }
  }
}

const terrain = new THREE.Group();
terrain.add(buildVoxelLayer(layer.grass,     grassMat));
terrain.add(buildVoxelLayer(layer.path,      pathMat));
terrain.add(buildVoxelLayer(layer.plaza,     plazaMat));
terrain.add(buildVoxelLayer(layer.sand,      sandMat));
terrain.add(buildVoxelLayer(layer.dirt,      dirtMat));
terrain.add(buildVoxelLayer(layer.stone,     stoneMat));
terrain.add(buildVoxelLayer(layer.darkStone, darkStone));
scene.add(terrain);

// 바다
const sea = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), waterMat);
sea.rotation.x = -Math.PI / 2;
sea.position.y = SEA_LEVEL - 0.2;
scene.add(sea);

// ---------- 3. 인터랙티브 건물 & 마을 오브젝트 관리 ----------
const interactiveObjects = [];

function registerInteractive(meshOrGroup, data) {
  meshOrGroup.userData.interactive = data;
  interactiveObjects.push(meshOrGroup);
}

// 공용 복셀 건물 재질
const woodMat   = new THREE.MeshLambertMaterial({ color: 0x7a4f2b });
const plasterMat= new THREE.MeshLambertMaterial({ color: 0xecf0f2 });
const redRoof   = new THREE.MeshLambertMaterial({ color: 0xb53c30 });
const blueRoof  = new THREE.MeshLambertMaterial({ color: 0x24558f });
const copperRoof= new THREE.MeshLambertMaterial({ color: 0xbf5d28 });
const glassMat  = new THREE.MeshBasicMaterial({ color: 0xffea88 });
const cyanEmblem= new THREE.MeshBasicMaterial({ color: 0x39d0ff });
const metalMat  = new THREE.MeshLambertMaterial({ color: 0xb5c1cd });

// ----- 3.1 🏛️ GATT 중앙 회관 (Central Service Hall) -----
const hall = new THREE.Group();
{
  const b1 = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2.2, 3.0), plasterMat);
  b1.position.y = 1.1;
  hall.add(b1);

  [[-1.8, -1.4], [1.8, -1.4], [-1.8, 1.4], [1.8, 1.4]].forEach(([px, pz]) => {
    const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.35, 2.3, 0.35), woodMat);
    pillar.position.set(px, 1.15, pz);
    hall.add(pillar);
  });

  const door = new THREE.Mesh(new THREE.BoxGeometry(0.95, 1.5, 0.08), woodMat);
  door.position.set(0, 0.75, 1.52);
  hall.add(door);

  [-1.1, 1.1].forEach(wx => {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.65, 0.04), glassMat);
    win.position.set(wx, 1.25, 1.52);
    hall.add(win);
  });

  const r1 = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.45, 3.4), redRoof);
  r1.position.y = 2.35;
  hall.add(r1);

  const r2 = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.45, 2.4), redRoof);
  r2.position.y = 2.75;
  hall.add(r2);

  const rune = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), cyanEmblem);
  rune.position.set(0, 3.25, 0);
  hall.add(rune);
}
hall.position.set(0, SURFACE_Y, -8.5);
scene.add(hall);

registerInteractive(hall, {
  title: "🏛️ GATT 중앙 회관",
  sub: "[데이터 프로필 허브]",
  desc: "스펙트럼 대륙의 모든 서비스(Service)와 특성(Characteristic)이 등록되는 행정 중앙 회관입니다. 시민 NPC들에게 데이터를 읽기(Read), 쓰기(Write), 알림(Notify) 받는 퀘스트를 수주합니다.",
  lore: "GATT는 BLE 연결 후 데이터를 계층(Profile > Service > Characteristic > Descriptor)으로 주고받는 표준 규격입니다.",
  link: "https://yalex-kim.github.io/connectivityBook/bluetooth/chapters/gatt.html",
  walkPos: new THREE.Vector3(0, SURFACE_Y, -6.2)
});

// ----- 3.2 📚 RF 이론 도서관 (Theory Library) -----
const library = new THREE.Group();
{
  const b = new THREE.Mesh(new THREE.BoxGeometry(3.0, 2.0, 2.6), plasterMat);
  b.position.y = 1.0;
  library.add(b);

  const door = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.08), woodMat);
  door.position.set(0.8, 0.7, 1.32);
  library.add(door);

  [-0.65, 0.1].forEach(wx => {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.7, 0.04), glassMat);
    win.position.set(wx, 1.1, 1.32);
    library.add(win);
  });

  const roof1 = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.4, 3.1), blueRoof);
  roof1.position.y = 2.15;
  library.add(roof1);

  const roof2 = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.4, 2.0), blueRoof);
  roof2.position.y = 2.5;
  library.add(roof2);

  const dome = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.8), darkStone);
  dome.position.set(-0.6, 2.85, 0);
  library.add(dome);

  const domeRod = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.5, 6), metalMat);
  domeRod.position.set(-0.6, 3.3, 0);
  library.add(domeRod);
}
library.position.set(-9.0, SURFACE_Y, -1.0);
scene.add(library);

registerInteractive(library, {
  title: "📚 RF 이론 도서관",
  sub: "[connectivityBook 연동 연구소]",
  desc: "2.4GHz 무선통신의 모든 원리가 기록된 지식의 성소입니다. 챕터 퀴즈를 풀면 스탯(TX 파워, 수신 감도)이 오르고 새로운 스킬 슬롯이 해금됩니다.",
  lore: "무선 통신 교과서 connectivityBook 15개 챕터의 원문 지식이 인터랙티브하게 보관되어 있습니다.",
  link: "https://yalex-kim.github.io/connectivityBook/bluetooth/chapters/intro.html",
  walkPos: new THREE.Vector3(-7.2, SURFACE_Y, -1.0)
});

// ----- 3.3 🔨 패킷 대장간 (Packet Forge & Battery Shop) -----
const forge = new THREE.Group();
{
  const b = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.8, 2.6), darkStone);
  b.position.y = 0.9;
  forge.add(b);

  const r = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.4, 3.0), copperRoof);
  r.position.y = 1.95;
  forge.add(r);

  const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.65, 2.2, 0.65), stoneMat);
  chimney.position.set(0.9, 1.7, -0.7);
  forge.add(chimney);

// ---------- 6. 충돌 판정 시스템 (AABB + 원형 장애물) ----------
// 기사 바운딩 반경
const KNIGHT_RADIUS = 0.42;

// 사각 장애물 AABB 목록 (건물 본체 및 등대 기단, 던전 게이트)
const OBSTACLE_BOXES = [
  // GATT 중앙 회관 (0, -8.5) — 문(앞쪽)으로 걸어 들어갈 수 있도록 앞쪽 여유 공간 확보
  { minX: -2.0, maxX: 2.0, minZ: -10.2, maxZ: -7.0 },
  // RF 이론 도서관 (-9.0, -1.0)
  { minX: -10.6, maxX: -7.4, minZ: -2.4, maxZ: 0.4 },
  // 패킷 대장간 (9.0, -1.0)
  { minX: 7.4, maxX: 10.6, minZ: -2.4, maxZ: 0.4 },
  // 전파의 등대 기단 (8.0, 8.0)
  { minX: 7.1, maxX: 8.9, minZ: 7.1, maxZ: 8.9 },
  // 호핑 던전 관문 좌우 기둥 (-9.0, -13.0)
  { minX: -10.6, maxX: -7.4, minZ: -13.5, maxZ: -12.5 }
];

// 원형 장애물 목록 (중앙 분수대, 나무 기둥)
const OBSTACLE_CIRCLES = [
  // 중앙 광장 분수대 (0, 0, 반경 1.85)
  { x: 0, z: 0, r: 1.85 },
  // 복셀 나무 줄기 (반경 0.45)
  ...TREE_POSITIONS.map(([tx, tz]) => ({ x: tx, z: tz, r: 0.45 }))
];

/**
 * 특정 (x, z) 위치에서 장애물 충돌 여부 검사
 */
function checkCollision(x, z) {
  // 섬 외곽 절벽 낭떠러지 이탈 방지 경계선
  if (Math.hypot(x, z) > 24.5) return true;

  // AABB 건물 충돌 검사
  for (let i = 0; i < OBSTACLE_BOXES.length; i++) {
    const b = OBSTACLE_BOXES[i];
    if (
      x >= b.minX - KNIGHT_RADIUS &&
      x <= b.maxX + KNIGHT_RADIUS &&
      z >= b.minZ - KNIGHT_RADIUS &&
      z <= b.maxZ + KNIGHT_RADIUS
    ) {
      return true;
    }
  }

  // 원형 장애물(분수대, 나무) 충돌 검사
  for (let i = 0; i < OBSTACLE_CIRCLES.length; i++) {
    const c = OBSTACLE_CIRCLES[i];
    const distSq = (x - c.x) ** 2 + (z - c.z) ** 2;
    const minDist = c.r + KNIGHT_RADIUS;
    if (distSq < minDist * minDist) {
      return true;
    }
  }

  return false;
}

// ---------- 7. 통합 이동 · 점프 · 물리 시스템 ----------
const keys = new Set();
const joystick = { right: 0, forward: 0, active: false };

let cameraYaw = 0;
let cameraPitch = 0.52;
let cameraDistance = 15;

const SPEED = 6.4;
const GRAVITY = -24.0;
const JUMP_FORCE = 8.5;

let velocityY = 0;
let isGrounded = true;
let squashTime = 0; // 착지 시 바운스 타이머
let walkAnimTime = 0;

function performJump() {
  if (isGrounded) {
    velocityY = JUMP_FORCE;
    isGrounded = false;
    document.getElementById("badge").textContent = "🦘 점프!";
  }
}

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    performJump();
    return;
  }
  keys.add(e.key.toLowerCase());
  targetDestination = null;
  targetMarker.visible = false;
});
window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

// 점프 버튼 이벤트
const btnJump = document.getElementById("btn-jump");
btnJump.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  e.stopPropagation();
  performJump();
});

function moveKnight(dt) {
  let rightInput = 0;
  let forwardInput = 0;

  if (keys.has("d") || keys.has("arrowright")) rightInput += 1;
  if (keys.has("a") || keys.has("arrowleft"))  rightInput -= 1;
  if (keys.has("w") || keys.has("arrowup"))    forwardInput += 1;
  if (keys.has("s") || keys.has("arrowdown"))  forwardInput -= 1;

  if (joystick.active) {
    rightInput = joystick.right;
    forwardInput = joystick.forward;
    targetDestination = null;
    targetMarker.visible = false;
  }

  const inputLen = Math.hypot(rightInput, forwardInput);
  let isMoving = false;

  const currentX = knight.position.x;
  const currentZ = knight.position.z;

  if (inputLen > 0.05) {
    isMoving = true;
    const fwdX = -Math.sin(cameraYaw);
    const fwdZ = -Math.cos(cameraYaw);
    const rightX = Math.cos(cameraYaw);
    const rightZ = -Math.sin(cameraYaw);

    const norm = inputLen > 1 ? 1 / inputLen : 1;
    const nx = rightInput * norm;
    const nz = forwardInput * norm;

    const moveStepX = (rightX * nx + fwdX * nz) * SPEED * dt * Math.min(1, inputLen);
    const moveStepZ = (rightZ * nx + fwdZ * nz) * SPEED * dt * Math.min(1, inputLen);

    // 슬라이딩 충돌: x축과 z축 분리 검사로 벽을 타고 부드럽게 미끄러짐
    if (!checkCollision(currentX + moveStepX, currentZ)) {
      knight.position.x += moveStepX;
    }
    if (!checkCollision(knight.position.x, currentZ + moveStepZ)) {
      knight.position.z += moveStepZ;
    }

    const worldDir = new THREE.Vector3(moveStepX, 0, moveStepZ);
    if (worldDir.lengthSq() > 0.0001) {
      const targetRotY = Math.atan2(worldDir.x, worldDir.z);
      knight.rotation.y = THREE.MathUtils.lerp(knight.rotation.y, targetRotY, Math.min(1, dt * 15));
    }
  } else if (targetDestination) {
    const diff = targetDestination.clone().sub(knight.position);
    diff.y = 0;
    const dist = diff.length();

    if (dist > 0.25) {
      isMoving = true;
      diff.normalize();
      const moveStepX = diff.x * SPEED * dt;
      const moveStepZ = diff.z * SPEED * dt;

      const preX = knight.position.x;
      const preZ = knight.position.z;

      if (!checkCollision(preX + moveStepX, preZ)) {
        knight.position.x += moveStepX;
      }
      if (!checkCollision(knight.position.x, preZ + moveStepZ)) {
        knight.position.z += moveStepZ;
      }

      // 양쪽 축 모두 막힌 경우 목표 도달 불가로 취소
      if (Math.abs(knight.position.x - preX) < 0.0001 && Math.abs(knight.position.z - preZ) < 0.0001) {
        targetDestination = null;
        targetMarker.visible = false;
      } else {
        const targetRotY = Math.atan2(diff.x, diff.z);
        knight.rotation.y = THREE.MathUtils.lerp(knight.rotation.y, targetRotY, Math.min(1, dt * 15));
      }
    } else {
      targetDestination = null;
      targetMarker.visible = false;
    }
  }

  // 지형 스냅 & 점프 중력 물리
  const groundY = groundHeightAt(knight.position.x, knight.position.z);

  if (!isGrounded) {
    velocityY += GRAVITY * dt;
    knight.position.y += velocityY * dt;

    if (knight.position.y <= groundY) {
      knight.position.y = groundY;
      velocityY = 0;
      isGrounded = true;
      squashTime = 0.22;
      triggerLandingEffect(knight.position.x, groundY, knight.position.z);
      document.getElementById("badge").textContent = "🛡️ GATT 빌리지 광장";
    }
  } else {
    // 지상에서는 계단이나 단차를 부드럽게 오르내림
    knight.position.y += (groundY - knight.position.y) * Math.min(1, dt * 16);
  }

  // 애니메이션 (착지 스쿼시 / 점프 스트레치 / 보행 바운스)
  if (squashTime > 0) {
    squashTime -= dt;
    const p = Math.max(0, squashTime / 0.22);
    // 착지 시 납작해졌다가 탄성 복원
    knightBody.scale.set(1 + p * 0.22, 1 - p * 0.22, 1 + p * 0.22);
    knightBody.position.y = 0.425 * (1 - p * 0.22);
  } else if (!isGrounded) {
    // 체공 중 상하 스트레치
    const stretch = Math.min(0.18, Math.abs(velocityY) * 0.015);
    knightBody.scale.set(1 - stretch * 0.5, 1 + stretch, 1 - stretch * 0.5);
    knightBody.position.y = 0.425;
  } else if (isMoving) {
    walkAnimTime += dt * 14;
    knightBody.scale.set(1, 1, 1);
    knightBody.position.y = 0.425 + Math.abs(Math.sin(walkAnimTime)) * 0.06;
  } else {
    knightBody.scale.set(1, 1, 1);
    knightBody.position.y = 0.425;
  }
}

// ---------- 8. 카메라 추종 & 회전 ----------
function updateCamera(dt) {
  const hDist = cameraDistance * Math.cos(cameraPitch);
  const vDist = cameraDistance * Math.sin(cameraPitch);

  const desiredX = knight.position.x + Math.sin(cameraYaw) * hDist;
  const desiredY = knight.position.y + vDist;
  const desiredZ = knight.position.z + Math.cos(cameraYaw) * hDist;

  camera.position.set(desiredX, desiredY, desiredZ);
  camera.lookAt(knight.position.x, knight.position.y + 1.0, knight.position.z);
}

// ---------- 9. 마우스 클릭 & 터치 인터랙션 ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

const activePointers = new Map();
let initialPinchDist = 0;
let initialPinchCamDist = 15;
let isPinching = false;

let pointerDownPos = { x: 0, y: 0 };
let isDraggingCamera = false;
let isPointerDown = false;
let activePointerId = null;

app.addEventListener("pointerdown", (e) => {
  if (
    e.target.closest("#joystick-zone") ||
    e.target.closest("#btn-reset") ||
    e.target.closest("#btn-jump") ||
    e.target.closest("#info-modal")
  ) return;

  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 1) {
    isPointerDown = true;
    activePointerId = e.pointerId;
    pointerDownPos = { x: e.clientX, y: e.clientY };
    if (e.button === 2) isDraggingCamera = true;
  } else if (activePointers.size === 2) {
    isPinching = true;
    isDraggingCamera = false;
    isPointerDown = false;
    const pts = Array.from(activePointers.values());
    initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    initialPinchCamDist = cameraDistance;
  }
});

window.addEventListener("pointermove", (e) => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  }

  if (isPinching && activePointers.size >= 2) {
    const pts = Array.from(activePointers.values());
    const curDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (curDist > 10 && initialPinchDist > 10) {
      const factor = initialPinchDist / curDist;
      cameraDistance = Math.max(6, Math.min(36, initialPinchCamDist * factor));
    }
    return;
  }

  if (!isPointerDown || e.pointerId !== activePointerId) return;

  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const dist = Math.hypot(dx, dy);

  if (dist > 8 || isDraggingCamera) {
    isDraggingCamera = true;
    cameraYaw -= dx * 0.006;
    cameraPitch = Math.max(0.15, Math.min(1.2, cameraPitch + dy * 0.005));
    pointerDownPos = { x: e.clientX, y: e.clientY };
  }
});

function handlePointerEnd(e) {
  activePointers.delete(e.pointerId);

  if (activePointers.size < 2) isPinching = false;

  if (e.pointerId === activePointerId) {
    if (isPointerDown && !isDraggingCamera && !isPinching && e.button !== 2) {
      handleClickOrTap(e.clientX, e.clientY);
    }
    isPointerDown = false;
    isDraggingCamera = false;
    activePointerId = null;
  }
}

window.addEventListener("pointerup", handlePointerEnd);
window.addEventListener("pointercancel", handlePointerEnd);

window.addEventListener("wheel", (e) => {
  cameraDistance = Math.max(6, Math.min(36, cameraDistance + e.deltaY * 0.015));
}, { passive: true });

window.addEventListener("contextmenu", (e) => e.preventDefault());

// 클릭 / 탭 핸들러
const modal = document.getElementById("info-modal");
const modalTitle = document.getElementById("modal-title");
const modalSub = document.getElementById("modal-sub");
const modalDesc = document.getElementById("modal-desc");
const modalLore = document.getElementById("modal-lore");
const modalLink = document.getElementById("modal-link");
document.getElementById("modal-close").addEventListener("click", () => {
  modal.style.display = "none";
});

function showInfoModal(data) {
  modalTitle.textContent = data.title;
  modalSub.textContent = data.sub;
  modalDesc.textContent = data.desc;
  modalLore.textContent = "📶 RF 이론: " + data.lore;
  modalLink.href = data.link;
  modal.style.display = "block";

  const badge = document.getElementById("badge");
  badge.textContent = `${data.title} 앞 도착`;

  if (data.walkPos) {
    setMoveTarget(data.walkPos);
  }
}

function handleClickOrTap(clientX, clientY) {
  pointer.x =  (clientX / window.innerWidth)  * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  // 1순위: 인터랙티브 건물/오브젝트 검사
  for (const obj of interactiveObjects) {
    const hits = raycaster.intersectObject(obj, true);
    if (hits.length > 0) {
      showInfoModal(obj.userData.interactive);
      return;
    }
  }

  // 2순위: 지형 바닥 클릭 이동
  const hits = raycaster.intersectObjects([sea, ...terrain.children], true);
  if (hits.length > 0) {
    const p = hits[0].point;
    // 장애물 내부 클릭 방지
    if (checkCollision(p.x, p.z)) return;

    const targetY = groundHeightAt(p.x, p.z);
    setMoveTarget(new THREE.Vector3(p.x, targetY, p.z));
    document.getElementById("badge").textContent = `📍 이동 중 (${p.x.toFixed(1)}, ${p.z.toFixed(1)})`;
    modal.style.display = "none";
  }
}

function setMoveTarget(pos) {
  targetDestination = pos;
  targetMarker.position.set(pos.x, pos.y + 0.04, pos.z);
  targetMarker.visible = true;
}

// 리셋 버튼
document.getElementById("btn-reset").addEventListener("click", () => {
  knight.position.copy(SPAWN_POS);
  targetDestination = null;
  targetMarker.visible = false;
  cameraYaw = 0;
  cameraPitch = 0.52;
  velocityY = 0;
  isGrounded = true;
  modal.style.display = "none";
  document.getElementById("badge").textContent = "🛡️ GATT 빌리지 광장 · 평지";
});

// ---------- 10. 가상 조이스틱 이벤트 ----------
const joyZone = document.getElementById("joystick-zone");
const joyBase = document.getElementById("joystick-base");
const joyThumb = document.getElementById("joystick-thumb");

const JOY_MAX_DIST = 38;
let joyPointerId = null;
let joyCenter = { x: 0, y: 0 };

joyZone.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  e.stopPropagation();
  joyPointerId = e.pointerId;
  joyZone.setPointerCapture(joyPointerId);

  const rect = joyBase.getBoundingClientRect();
  joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  joystick.active = true;
  updateJoystick(e.clientX, e.clientY);
});

joyZone.addEventListener("pointermove", (e) => {
  if (e.pointerId !== joyPointerId) return;
  e.preventDefault();
  updateJoystick(e.clientX, e.clientY);
});

function endJoystick(e) {
  if (e.pointerId !== joyPointerId) return;
  joyPointerId = null;
  joystick.active = false;
  joystick.right = 0;
  joystick.forward = 0;
  joyThumb.style.transform = `translate(0px, 0px)`;
}
joyZone.addEventListener("pointerup", endJoystick);
joyZone.addEventListener("pointercancel", endJoystick);

function updateJoystick(clientX, clientY) {
  const dx = clientX - joyCenter.x;
  const dy = clientY - joyCenter.y;
  const dist = Math.hypot(dx, dy);

  const clampedDist = Math.min(dist, JOY_MAX_DIST);
  const angle = Math.atan2(dy, dx);

  const thumbX = Math.cos(angle) * clampedDist;
  const thumbY = Math.sin(angle) * clampedDist;
  joyThumb.style.transform = `translate(${thumbX}px, ${thumbY}px)`;

  const norm = clampedDist / JOY_MAX_DIST;
  joystick.right = (thumbX / JOY_MAX_DIST) * norm;
  joystick.forward = -(thumbY / JOY_MAX_DIST) * norm;
}

// ---------- 11. 렌더 루프 ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  moveKnight(dt);
  updateCamera(dt);

  const t = clock.elapsedTime;
  // 비콘 점멸
  tower.userData.beacon.material.color.setHSL(0.55, 0.9, 0.45 + 0.35 * Math.sin(t * 3.5));
  // 분수대 중앙 블루투스 룬 회전
  fountain.userData.rune.rotation.y = t * 1.5;
  fountain.userData.rune.position.y = 1.3 + Math.sin(t * 2.5) * 0.08;
  // 포털 소용돌이 맥동
  dungeonGate.userData.portal.scale.set(1 + 0.06 * Math.sin(t * 4), 1 + 0.06 * Math.cos(t * 3), 1);
  sea.position.z = Math.sin(t * 0.3) * 0.4;

  if (targetMarker.visible) {
    targetMarker.rotation.y = t * 2;
    const s = 1 + 0.15 * Math.sin(t * 6);
    targetMarker.scale.set(s, 1, s);
  }

  // 착지 충격파 링 애니메이션
  if (landingRingTimer > 0) {
    landingRingTimer -= dt;
    const progress = 1 - (landingRingTimer / 0.28);
    const s = 1 + progress * 2.4;
    landingRing.scale.set(s, s, 1);
    landingRing.material.opacity = Math.max(0, 0.85 * (1 - progress));
    if (landingRingTimer <= 0) landingRing.visible = false;
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
