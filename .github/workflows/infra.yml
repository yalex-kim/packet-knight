# D1 데이터베이스(packetknight) 준비 — 없으면 만들고, migrations/ 를 원격에 적용한다. 수동 실행.
name: Infra
on:
  workflow_dispatch:
    inputs:
      set_admin:
        description: "게시판 관리자(ADMIN_SUBS)를 가장 먼저 가입한 계정으로 설정"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  d1:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c0def7a36886c178cce96f73375f8f97
      W: npx --yes wrangler@4.156.2
    steps:
      - uses: actions/checkout@v4
      - name: Ensure database
        run: |
          $W d1 list --json > list.json
          if ! grep -q '"name": *"packetknight"' list.json; then $W d1 create packetknight; $W d1 list --json > list.json; fi
          ID=$(node -e 'const l=require("./list.json");console.log(l.find(x=>x.name==="packetknight").uuid)')
          echo "D1_ID=$ID"
          printf 'name = "packetknight-infra"\ncompatibility_date = "2026-10-01"\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "packetknight"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "$ID" > wrangler.infra.toml
      - name: Apply migrations
        run: $W d1 migrations apply packetknight --remote -c wrangler.infra.toml
      - name: Set board admin (first user)
        if: ${{ inputs.set_admin }}
        run: |
          ID=$($W d1 execute packetknight --remote -c wrangler.infra.toml --json --command "SELECT id FROM users ORDER BY created_at LIMIT 1" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);process.stdout.write(String(r[0].results[0].id))})')
          echo "::add-mask::$ID"
          printf '%s' "$ID" | $W pages secret put ADMIN_SUBS --project-name packetknight
          echo "ADMIN_SUBS set (value masked)"
