# 일회용: CLOUDFLARE_API_TOKEN 을 대상 저장소의 Actions 공개키로 암호화(sealed box)해 출력한다.
# 암호문은 GitHub 만 복호화할 수 있고, 대상 저장소 secret 등록에만 쓰인다. 사용 후 삭제.
name: Share CF token (sealed)
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: "대상 저장소 Actions secrets public key (base64)"
        required: true
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q pynacl
      - name: Seal
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBKEY: ${{ inputs.public_key }}
        run: |
          python3 - <<'PY'
          import os, base64
          from nacl import public, encoding
          pk = public.PublicKey(os.environ["PUBKEY"].encode(), encoding.Base64Encoder())
          ct = public.SealedBox(pk).encrypt(os.environ["TOKEN"].encode())
          print("SEALED=" + base64.b64encode(ct).decode())
          PY
